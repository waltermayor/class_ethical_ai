services:

  spark-master:
    image: spark:3.5.8
    container_name: spark-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      SPARK_EXTRA_CLASSPATH: "/opt/extra-jars/*"
    volumes:
      - ./data:/workspace/data
      - ./jars:/opt/extra-jars

  spark-worker-1:
    image: spark:3.5.8
    container_name: spark-worker-1
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_EXTRA_CLASSPATH: "/opt/extra-jars/*"
      SPARK_WORKER_CORES: "4"
      SPARK_WORKER_MEMORY: "10g"
      SPARK_DAEMON_MEMORY: "1g"
    volumes:
      - ./data:/workspace/data
      - ./jars:/opt/extra-jars
    depends_on:
      - spark-master

  spark-worker-2:
    image: spark:3.5.8
    container_name: spark-worker-2
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_EXTRA_CLASSPATH: "/opt/extra-jars/*"
      SPARK_WORKER_CORES: "4"
      SPARK_WORKER_MEMORY: "10g"
      SPARK_DAEMON_MEMORY: "1g"
    volumes:
      - ./data:/workspace/data
      - ./jars:/opt/extra-jars
    depends_on:
      - spark-master

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter

    container_name: jupyter
    hostname: jupyter
    working_dir: /workspace
    environment:
      SPARK_EXTRA_CLASSPATH: "/opt/extra-jars/*"

    volumes:
      - ./notebooks:/workspace/notebooks
      - ./data:/workspace/data
      - ./jars:/opt/extra-jars

    ports:
      - "8888:8888"

    depends_on:
      - spark-master
  

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"